# Test-only overrides — disable OAuth2 client auto-config so JWT-only resource server
# is the active security mode (mirrors prod behavior when no GOOGLE_CLIENT_ID is set).
# Without this, OAuth2ClientProperties.validateRegistration() rejects the empty
# client-id from application.properties (${GOOGLE_CLIENT_ID:}) and the test context
# fails to load with: "Client id of registration 'google' must not be empty."
spring.autoconfigure.exclude=\
  org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
