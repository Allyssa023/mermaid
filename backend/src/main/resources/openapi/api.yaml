            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /buyer/profile:
    get:
      tags: [Buyer Profile]
      summary: Get buyer profile
      operationId: getBuyerProfile
      responses:
        '200':
          description: Buyer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'
    patch:
      tags: [Buyer Profile]
      summary: Update buyer profile
      operationId: updateBuyerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'

  /buyer/orders/{orderId}/payment-intent:
    post:
      tags: [Buyer Orders]
      summary: Create a payment intent for an order
      operationId: createPaymentIntent
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Payment already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/paymongo:
    post:
      tags: [Webhooks]
      summary: PayMongo webhook handler
      operationId: handlePaymongoWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        format: int64
    AdvisoryId:
      in: path
      name: advisoryId
      required: true
      schema:
        type: integer
        format: int64
    SpeciesId:
      in: path
      name: speciesId
      required: true
      schema:
        type: integer
        format: int64
    LocationId:
      in: path
      name: locationId
      required: true
      schema:
        type: integer
        format: int64
    ListingId:
      in: path
      name: listingId
      required: true
      schema:
        type: integer
        format: int64
    TripId:
      in: path
      name: tripId
      required: true
      schema:
        type: integer
        format: int64
    CatchId:
      in: path
      name: catchId
      required: true
      schema:
        type: integer
        format: int64
    AlertId:
      in: path
      name: alertId
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        rememberMe:
          type: boolean
          default: false

    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum: [VENDOR, FISHERMAN, BUYER]
          description: Self-registration only allows VENDOR, FISHERMAN, or BUYER

    LoginResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds (optional, for client use)
        otpRequired:
          type: boolean
          description: When true, the client should show the OTP input step
        user:
          $ref: '#/components/schemas/UserProfile'

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UserCreateRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'

    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean

    UserProfile:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean

    ChatMessage:
      type: object
      required: [id, senderId, recipientId, content, sentAt, read]
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        read:
          type: boolean

    Role:
      type: string
      enum: [ADMIN, VENDOR, FISHERMAN, BUYER]

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    RiskLevel:
      type: string
      enum: [SAFE, CAUTION, UNSAFE]

    DemandListingStatus:
      type: string
      enum: [OPEN, CLOSED]

    TripStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]

    FishSpecies:
      type: object
      required: [id, commonName, active]
      properties:
        id:
          type: integer
          format: int64
        commonName:
          type: string
        scientificName:
          type: string
          nullable: true
        active:
          type: boolean

    FishSpeciesCreateRequest:
      type: object
      required: [commonName]
      properties:
        commonName:
          type: string
          minLength: 2
          maxLength: 100
        scientificName:
          type: string
          nullable: true

    MarketLocation:
      type: object
      required: [id, name, municipality, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        municipality:
          type: string
        province:
          type: string
          nullable: true
        active:
          type: boolean
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true

    BuyerPlaceOrderRequest:
      type: object
      required: [listingId, dispatchMode]
      properties:
        listingId:
          type: integer
          format: int64
        orderedQtyKg:
          type: number
          format: double
          nullable: true
        orderedQtyEstimate:
          type: string
          nullable: true
        dispatchMode:
          type: string
          enum: [PICKUP, DELIVERY]
        deliveryAddress:
          type: string
          nullable: true
          description: Required when dispatchMode is DELIVERY
        notes:
          type: string
          nullable: true

    MarketLocationCreateRequest:
      type: object
      required: [name, municipality]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        municipality:
          type: string
          minLength: 2
          maxLength: 100
        province:
          type: string
          nullable: true

    Advisory:
      type: object
      required: [id, title, message, severity, affectedArea, activeFrom, activeTo, isActive]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdByUserId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdvisoryCreateRequest:
      type: object
      required: [title, message, severity, affectedArea, activeFrom, activeTo]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 5
          maxLength: 1000
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
          minLength: 2
          maxLength: 150
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean
          default: true

    AdvisoryUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 5
          maxLength: 1000
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
          minLength: 2
          maxLength: 150
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean

    DemandListing:
      type: object
      required:
