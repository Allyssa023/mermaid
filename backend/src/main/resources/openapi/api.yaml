        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Timeline events for the order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderStatusEvent'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /messages/users:
    get:
      tags: [Chat]
      summary: Get users with whom the current user has active conversations
      operationId: getChatUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
