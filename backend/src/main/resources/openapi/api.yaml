openapi: 3.0.3
info:
  title: MERMAID API
  version: 1.0.0
  description: |
    MERMAID (Marine Safety and Market Information Dashboard) API.
    MVP scope includes authentication, advisories, marine conditions,
    vendor demand listings, fisherman marketplace, trip sessions, and catch logs.

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Auth
  - name: Marine
  - name: Advisories
  - name: Admin
  - name: Vendor Demand Listings
  - name: Marketplace
  - name: Trips
  - name: Catch Logs
  - name: Catch Alerts
  - name: Orders
  - name: Buyer Marketplace
  - name: Buyer Cart
  - name: Buyer Favorites
  - name: Buyer Addresses
  - name: Buyer Checkout
  - name: Buyer Orders
  - name: Reviews
  - name: Lookups
  - name: Uploads
  - name: Notifications
  - name: Buyer Profile
  - name: Webhooks
  - name: Vendor Inventory
  - name: Vendor Storefront
  - name: Vendor Orders
  - name: Vendor Procurement
  - name: Vendor Watchlist
  - name: Vendor Shop
  - name: Public
  - name: Fisherman Procurement
  - name: Fisherman Earnings
    description: Fisherman earnings ledger and summary
  - name: Fisherman Profile
    description: Fisherman vessel and safety contact management
  - name: Order Disputes
    description: Dispute management for procurement orders
  - name: Payouts
    description: Payment disbursement to fishermen
  - name: Deals
    description: Vendor/fisherman price-and-quantity negotiation on catch alerts

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error (e.g. invalid email format, password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Self-sign-up as Fisherman or Vendor. Client should call POST /auth/login after registration to obtain an access token.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified, JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent (always succeeds to prevent enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP code for 2-step login
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: OTP verified, JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/complete-profile:
    post:
      tags: [Auth]
      summary: Complete profile for new OAuth2 users (set role)
      operationId: completeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Profile completed, updated UserProfile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register-message:
    post:
      tags: [Auth]
      summary: Register a new user (returns message)
      description: Self-sign-up as Fisherman or Vendor. Returns a message instructing user to verify email.
      operationId: registerWithMessage
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lookups/fish-species:
    get:
      tags: [Lookups]
      summary: List fish species
      operationId: listFishSpecies
      responses:
        '200':
          description: Fish species list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FishSpecies'

  /lookups/market-locations:
    get:
      tags: [Lookups]
      summary: List market locations
      operationId: listMarketLocations
      responses:
        '200':
          description: Market locations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketLocation'

  /marine/conditions:
    get:
      tags: [Marine]
      summary: Current conditions — all zones
      operationId: getAllMarineConditions
      responses:
        '200':
          description: Conditions for all fishing zones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllMarineConditionsResponse'
        '503':
          description: Marine data service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /marine/conditions/{zoneId}:
    get:
      tags: [Marine]
      summary: Current conditions — single zone
      operationId: getMarineConditionsByZone
      parameters:
        - in: path
          name: zoneId
          required: true
          schema:
            type: string
          description: "Zone ID — e.g. manila_bay, visayan_sea"
      responses:
        '200':
          description: Conditions for the requested zone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarineConditionsResponse'
        '404':
          description: Zone ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Marine data service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /advisories:
    get:
      tags: [Advisories]
      summary: List advisories (optionally active only)
      operationId: listAdvisories
      parameters:
        - in: query
          name: activeOnly
          required: false
          schema:
            type: boolean
            default: true
        - in: query
          name: severity
          required: false
          schema:
            $ref: '#/components/schemas/Severity'
      responses:
        '200':
          description: Advisories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (Admin only)
      operationId: adminListUsers
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Admin]
      summary: Create user (Admin only)
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: Get user by id (Admin only)
      operationId: adminGetUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Admin]
      summary: Update user (Admin only)
      operationId: adminUpdateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/fish-species:
    post:
      tags: [Admin]
      summary: Create fish species (Admin only)
      operationId: adminCreateFishSpecies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishSpeciesCreateRequest'
      responses:
        '201':
          description: Fish species created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishSpecies'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/fish-species/{speciesId}:
    put:
      tags: [Admin]
      summary: Update fish species (Admin only)
      operationId: adminUpdateFishSpecies
      parameters:
        - $ref: '#/components/parameters/SpeciesId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FishSpeciesCreateRequest'
      responses:
        '200':
          description: Fish species updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FishSpecies'
        '404':
          description: Fish species not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Admin]
      summary: Delete fish species (Admin only)
      operationId: adminDeleteFishSpecies
      parameters:
        - $ref: '#/components/parameters/SpeciesId'
      responses:
        '204':
          description: Fish species deleted
        '404':
          description: Fish species not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/market-locations:
    post:
      tags: [Admin]
      summary: Create market location (Admin only)
      operationId: adminCreateMarketLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketLocationCreateRequest'
      responses:
        '201':
          description: Market location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLocation'

  /admin/market-locations/{locationId}:
    put:
      tags: [Admin]
      summary: Update market location (Admin only)
      operationId: adminUpdateMarketLocation
      parameters:
        - $ref: '#/components/parameters/LocationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketLocationCreateRequest'
      responses:
        '200':
          description: Market location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketLocation'

    delete:
      tags: [Admin]
      summary: Delete market location (Admin only)
      operationId: adminDeleteMarketLocation
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '204':
          description: Market location deleted

  /admin/advisories:
    get:
      tags: [Admin]
      summary: List all advisories (Admin only)
      operationId: adminListAdvisories
      responses:
        '200':
          description: Advisories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'

    post:
      tags: [Admin]
      summary: Create advisory (Admin only)
      operationId: adminCreateAdvisory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryCreateRequest'
      responses:
        '201':
          description: Advisory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/advisories/{advisoryId}:
    get:
      tags: [Admin]
      summary: Get advisory by ID (Admin only)
      operationId: adminGetAdvisoryById
      parameters:
        - $ref: '#/components/parameters/AdvisoryId'
      responses:
        '200':
          description: Advisory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '404':
          description: Advisory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Admin]
      summary: Update advisory (Admin only)
      operationId: adminUpdateAdvisory
      parameters:
        - $ref: '#/components/parameters/AdvisoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisoryUpdateRequest'
      responses:
        '200':
          description: Advisory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
        '404':
          description: Advisory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Admin]
      summary: Delete advisory (Admin only)
      operationId: adminDeleteAdvisory
      parameters:
        - $ref: '#/components/parameters/AdvisoryId'
      responses:
        '204':
          description: Advisory deleted

  /admin/orders/{orderId}/resolve:
    post:
      tags: [Admin]
      summary: Admin resolves a disputed order
      operationId: adminResolveDispute
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResolveDisputeRequest'
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vendor/demand-listings:
    get:
      tags: [Vendor Demand Listings]
      summary: List current vendor's demand listings
      operationId: vendorListDemandListings
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/DemandListingStatus'
      responses:
        '200':
          description: Vendor demand listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemandListing'

    post:
      tags: [Vendor Demand Listings]
      summary: Create demand listing
      operationId: vendorCreateDemandListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandListingCreateRequest'
      responses:
        '201':
          description: Demand listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandListing'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vendor/demand-listings/{listingId}:
    get:
      tags: [Vendor Demand Listings]
      summary: Get vendor demand listing by ID
      operationId: vendorGetDemandListingById
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Demand listing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandListing'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Vendor Demand Listings]
      summary: Update demand listing
      operationId: vendorUpdateDemandListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandListingUpdateRequest'
      responses:
        '200':
          description: Demand listing updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandListing'

    delete:
      tags: [Vendor Demand Listings]
      summary: Delete demand listing
      operationId: vendorDeleteDemandListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '204':
          description: Demand listing deleted

  /vendor/demand-listings/{listingId}/close:
    post:
      tags: [Vendor Demand Listings]
      summary: Close demand listing
      operationId: vendorCloseDemandListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Demand listing closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandListing'

  /vendor/demand-listings/interests:
    get:
      tags: [Vendor Demand Listings]
      summary: List all fisherman interests across vendor's own listings
      operationId: vendorGetListingInterests
      responses:
        '200':
          description: Interests expressed by fishermen on vendor's listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorInterestItem'

  /vendor/inventory/lots:
    get:
      tags: [Vendor Inventory]
      summary: List vendor's inventory lots
      operationId: vendorListInventoryLots
      parameters:
        - in: query
          name: speciesId
          schema:
            type: integer
            format: int64
        - in: query
          name: includeEmpty
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Inventory lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryLotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vendor/inventory/adjustments:
    post:
      tags: [Vendor Inventory]
      summary: Record a manual inventory adjustment
      operationId: vendorRecordAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentRequest'
      responses:
        '200':
          description: Updated lot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Adjustment would result in negative stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vendor/inventory/availability:
    get:
      tags: [Vendor Inventory]
      summary: Get total available kg for a species
      operationId: vendorGetInventoryAvailability
      parameters:
        - in: query
          name: speciesId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Available kg
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableKg:
                    type: number
                    format: double
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vendor/storefront/listings:
    get:
      tags: [Vendor Storefront]
      summary: List vendor's storefront listings
      operationId: vendorListStorefrontListings
      responses:
        '200':
          description: Storefront listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorefrontListingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Vendor Storefront]
      summary: Create a storefront listing
      operationId: vendorCreateStorefrontListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorefrontListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
