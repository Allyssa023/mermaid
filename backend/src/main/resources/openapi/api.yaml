            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Notification marked as read

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: All notifications marked as read

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      operationId: getUnreadCount
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /buyer/profile:
    get:
      tags: [Buyer Profile]
      summary: Get buyer profile
      operationId: getBuyerProfile
      responses:
        '200':
          description: Buyer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'
    patch:
      tags: [Buyer Profile]
      summary: Update buyer profile
      operationId: updateBuyerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerProfile'

  /buyer/orders/{orderId}/payment-intent:
    post:
      tags: [Buyer Orders]
      summary: Create a payment intent for an order
      operationId: createPaymentIntent
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: method
          required: false
          schema:
            type: string
            enum: [GCASH, PAYMAYA, CARD]
            default: CARD
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Payment already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /buyer/orders/{orderId}/confirm-receipt:
    post:
      tags: [Buyer Orders]
      summary: Buyer confirms receipt of delivered order
      operationId: buyerConfirmReceipt
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /buyer/orders/{orderId}/dispute:
    post:
      tags: [Buyer Orders]
      summary: Buyer raises a dispute on a delivered order
      operationId: buyerDisputeOrder
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerDisputeRequest'
      responses:
        '200':
          description: Order disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/credit/settle:
    put:
      tags: [Orders]
      summary: Settle a credit payment
      description: Vendor pays off an outstanding credit (utang). Updates payment status from CONFIRMED to SETTLED.
      operationId: settleCredit
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditSettleRequest'
      responses:
        '200':
          description: Credit settled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
        '404':
          description: Order or payment not found
        '400':
          description: Payment is not a credit or already settled

  /webhooks/xendit:
    post:
      tags: [Webhooks]
      summary: Xendit webhook handler
      operationId: handleXenditWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
        - in: header
          name: x-callback-token
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Processed
        '401':
          description: Invalid token

  /orders/{orderId}/payout:
    post:
      tags: [Payouts]
      summary: Initiate GCash/Maya payout to fisherman after handoff
      operationId: initiateOrderPayout
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPayoutRequest'
      responses:
        '201':
          description: Payout initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayoutResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Payout already initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Fisherman has no e-wallet number on file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deals/mine:
    get:
      tags: [Deals]
      summary: List my deals (vendor or fisherman)
      operationId: listMyDeals
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/DealStatus'
      responses:
        '200':
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DealSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}:
    get:
      tags: [Deals]
      summary: Get deal by id (participant)
      operationId: getDeal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/messages:
    get:
      tags: [Deals]
      summary: List chat messages on a deal
      operationId: listDealMessages
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: page
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealMessagesPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/proposals:
    post:
      tags: [Deals]
      summary: Submit a new proposal on a deal
      operationId: createDealProposal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '200':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealProposalDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/proposals/{proposalId}/accept:
    post:
      tags: [Deals]
      summary: Accept a proposal (counterparty only)
      description: Accepting transitions the deal to AGREED and creates the corresponding order.
      operationId: acceptDealProposal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
        - in: path
          name: proposalId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Deal agreed, order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptProposalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/proposals/{proposalId}/reject:
    post:
      tags: [Deals]
      summary: Reject a proposal (counterparty only)
      operationId: rejectDealProposal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
        - in: path
          name: proposalId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProposalRequest'
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealProposalDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/engage:
    post:
      tags: [Deals]
      summary: Fisherman engages a deal (idempotent)
      operationId: engageDeal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Engaged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngageDealResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/reject:
    post:
      tags: [Deals]
      summary: Fisherman rejects a deal outright
      operationId: rejectDeal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProposalRequest'
      responses:
        '200':
          description: Deal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/cancel:
    post:
      tags: [Deals]
      summary: Cancel a deal (either participant)
      operationId: cancelDeal
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDealRequest'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deals/{id}/competitor-count:
    get:
      tags: [Deals]
      summary: Get count of competing vendor deals on the same alert
      operationId: getDealCompetitorCount
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Competitor count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitorCountDto'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /fisherman/alerts/{alertId}/deals:
    get:
      tags: [Deals]
      summary: List all vendor deals on a fisherman's alert
      operationId: listFishermanAlertDeals
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DealSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: integer
        format: int64
    AdvisoryId:
      in: path
      name: advisoryId
      required: true
      schema:
        type: integer
        format: int64
    SpeciesId:
      in: path
      name: speciesId
      required: true
      schema:
        type: integer
        format: int64
    LocationId:
      in: path
      name: locationId
      required: true
      schema:
        type: integer
        format: int64
    ListingId:
      in: path
      name: listingId
      required: true
      schema:
        type: integer
        format: int64
    TripId:
      in: path
      name: tripId
      required: true
      schema:
        type: integer
        format: int64
    CatchId:
      in: path
      name: catchId
      required: true
      schema:
        type: integer
        format: int64
    AlertId:
      in: path
      name: alertId
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        rememberMe:
          type: boolean
          default: false

    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum: [VENDOR, FISHERMAN, BUYER]
          description: Self-registration only allows VENDOR, FISHERMAN, or BUYER

    LoginResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds (optional, for client use)
        otpRequired:
          type: boolean
          description: When true, the client should show the OTP input step
        user:
          $ref: '#/components/schemas/UserProfile'

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UserCreateRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'

    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean

    UserProfile:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean

    ChatMessage:
      type: object
      required: [id, senderId, recipientId, content, sentAt, read]
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        read:
          type: boolean
        dealId:
          type: integer
          format: int64
          nullable: true
          description: If set, message is part of a deal negotiation thread.

    Role:
      type: string
      enum: [ADMIN, VENDOR, FISHERMAN, BUYER]

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    RiskLevel:
      type: string
      enum: [SAFE, CAUTION, UNSAFE]

    DemandListingStatus:
      type: string
      enum: [OPEN, CLOSED]

    TripStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]

    FishSpecies:
      type: object
      required: [id, commonName, active]
      properties:
        id:
          type: integer
          format: int64
        commonName:
          type: string
        scientificName:
          type: string
          nullable: true
        active:
          type: boolean

    FishSpeciesCreateRequest:
      type: object
      required: [commonName]
      properties:
        commonName:
          type: string
          minLength: 2
          maxLength: 100
        scientificName:
          type: string
          nullable: true

    MarketLocation:
      type: object
      required: [id, name, municipality, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        municipality:
          type: string
        province:
          type: string
          nullable: true
        active:
          type: boolean
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true

    BuyerPlaceOrderRequest:
      type: object
      required: [listingId, dispatchMode]
      properties:
        listingId:
          type: integer
          format: int64
        orderedQtyKg:
          type: number
          format: double
          nullable: true
        orderedQtyEstimate:
          type: string
          nullable: true
        dispatchMode:
          type: string
          enum: [PICKUP, DELIVERY]
        deliveryAddress:
          type: string
          nullable: true
          description: Required when dispatchMode is DELIVERY
        notes:
          type: string
          nullable: true

    MarketLocationCreateRequest:
      type: object
      required: [name, municipality]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        municipality:
          type: string
          minLength: 2
          maxLength: 100
        province:
          type: string
          nullable: true

    Advisory:
      type: object
      required: [id, title, message, severity, affectedArea, activeFrom, activeTo, isActive]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdByUserId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdvisoryCreateRequest:
      type: object
      required: [title, message, severity, affectedArea, activeFrom, activeTo]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 5
          maxLength: 1000
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
          minLength: 2
          maxLength: 150
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean
          default: true

    AdvisoryUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 5
          maxLength: 1000
        severity:
          $ref: '#/components/schemas/Severity'
        affectedArea:
          type: string
          minLength: 2
          maxLength: 150
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        isActive:
          type: boolean

    DemandListing:
      type: object
      required:
        [id, vendorId, fishSpecies, marketLocation, quantityKg, offerPricePerKg, status, postedAt]
      properties:
        id:
          type: integer
          format: int64
        vendorId:
          type: integer
          format: int64
        vendorName:
          type: string
          nullable: true
        fishSpecies:
          $ref: '#/components/schemas/FishSpecies'
        marketLocation:
          $ref: '#/components/schemas/MarketLocation'
        quantityKg:
          type: number
          format: double
        offerPricePerKg:
