spring.application.name=mermaid-backend

# .env lives at the repo root (one level above backend/), where ./mvnw runs.
# spring-dotenv (pom.xml) loads it into the Environment so ${VAR:default}
# placeholders below pick up its values.
dotenv.directory=./../

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mermaid_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# JWT (use env in production; min 256 bits for HS256)
jwt.secret=${JWT_SECRET:your-256-bit-secret-change-in-production-use-env-var}
jwt.issuer=${JWT_ISSUER:mermaid-api}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:86400}

server.error.include-stacktrace=never
server.error.include-message=always

logging.level.com.mermaid.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG

# CORS — comma-separated list of allowed origins (set CORS_ALLOWED_ORIGINS env var in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Email (Mailtrap HTTP API) — avoids SMTP port blocking in Docker ──
mailtrap.api-token=${MAILTRAP_API_TOKEN:}
mailtrap.inbox-id=${MAILTRAP_INBOX_ID:}

# Frontend URL used in email links and OAuth2 redirects
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Skip email verification + OTP on register/login (for E2E tests / local dev).
# Set SKIP_EMAIL_VERIFICATION=false in production.
app.skip-email-verification=${SKIP_EMAIL_VERIFICATION:false}

# ── Google OAuth2 — only active when GOOGLE_CLIENT_ID env var is set ──────────
# Set these env vars in production to enable social login:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
#   FACEBOOK_APP_ID, FACEBOOK_APP_SECRET, FACEBOOK_REDIRECT_URI

# Marine service integration
# Override all three via env vars in non-local environments
marine.service.url=${MARINE_SERVICE_URL:http://localhost:8081}
# IMPORTANT: set MARINE_API_KEY env var in all non-local deployments
marine.service.api-key=${MARINE_API_KEY:dev-marine-key-change-in-prod}
marine.service.timeout-seconds=5
marine.cache.conditions-ttl-seconds=300

# Eureka client (disabled by default; enabled via env var in Docker)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── File Uploads (Phase 3.3) ───────────────────────────────────────────────────
app.upload-dir=${UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080/api}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Xendit payment gateway ─────────────────────────────────────────────────────
xendit.secret-key=${XENDIT_SECRET_KEY:}
xendit.public-key=${XENDIT_PUBLIC_KEY:}
xendit.webhook-token=${XENDIT_WEBHOOK_TOKEN:}
xendit.callback-url=${XENDIT_CALLBACK_URL:http://localhost:8080/api/webhooks/xendit}


# ── Async (for notification events) ───────────────────────────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ── SMS — textbee gateway ──────────────────────────────────────────────────────
sms.textbee.api-key=${SMS_TEXTBEE_API_KEY:}
sms.textbee.globe-device-id=${SMS_TEXTBEE_GLOBE_DEVICE_ID:}
sms.textbee.smart-device-id=${SMS_TEXTBEE_SMART_DEVICE_ID:}
sms.textbee.base-url=https://api.textbee.dev