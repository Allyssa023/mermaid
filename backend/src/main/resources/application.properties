spring.application.name=mermaid-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mermaid_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT (use env in production; min 256 bits for HS256)
jwt.secret=${JWT_SECRET:your-256-bit-secret-change-in-production-use-env-var}
jwt.issuer=${JWT_ISSUER:mermaid-api}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:86400}

logging.level.com.mermaid.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG

# CORS — comma-separated list of allowed origins (set CORS_ALLOWED_ORIGINS env var in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Email (Mailtrap HTTP API) — avoids SMTP port blocking in Docker ──
mailtrap.api-token=${MAILTRAP_API_TOKEN:}
mailtrap.inbox-id=${MAILTRAP_INBOX_ID:}

# Frontend URL used in email links and OAuth2 redirects
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── Google OAuth2 ──────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8090/api/login/oauth2/code/google}

# ── Facebook OAuth2 ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8090/api/login/oauth2/code/facebook}

# Marine service integration
# Override all three via env vars in non-local environments
marine.service.url=${MARINE_SERVICE_URL:http://localhost:8081}
# IMPORTANT: set MARINE_API_KEY env var in all non-local deployments
marine.service.api-key=${MARINE_API_KEY:dev-marine-key-change-in-prod}
marine.service.timeout-seconds=5
marine.cache.conditions-ttl-seconds=300

# Eureka client (disabled by default; enabled via env var in Docker)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── File Uploads (Phase 3.3) ───────────────────────────────────────────────────
app.upload-dir=${UPLOAD_DIR:uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080/api}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── PayMongo (Phase 3.1) ──────────────────────────────────────────────────────
paymongo.public-key=${PAYMONGO_PUBLIC_KEY:}
paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET:}

# ── Async (for notification events) ───────────────────────────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5