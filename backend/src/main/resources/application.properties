spring.application.name=app

spring.application.name=mermaid-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mermaid_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT (use env in production; min 256 bits for HS256)
jwt.secret=${JWT_SECRET:your-256-bit-secret-change-in-production-use-env-var}
jwt.issuer=${JWT_ISSUER:mermaid-api}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:86400}

logging.level.com.mermaid.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG