# ══════════════════════════════════════════════════════════
#  MERMAID — Full Stack Docker Compose
#  Usage:
#    cp .env.docker .env       # (first time only)
#    docker-compose up --build
# ══════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ─────────────────────────────────
  mermaid-db:
    image: postgres:16-alpine
    container_name: mermaid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mermaid_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mermaid_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mermaid-net

  # ── Spring Boot Backend ─────────────────────────────────
  mermaid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mermaid-backend
    restart: unless-stopped
    depends_on:
      mermaid-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://mermaid-db:5432/${POSTGRES_DB:-mermaid_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-change-in-production-use-env-var}
      JWT_ISSUER: ${JWT_ISSUER:-mermaid-api}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-86400}
      MARINE_SERVICE_URL: http://mermaid-marine:8081
      MARINE_API_KEY: ${MARINE_API_KEY:-dev-marine-key-change-in-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8080:8080"
    networks:
      - mermaid-net

  # ── Django Marine Service ───────────────────────────────
  mermaid-marine:
    build:
      context: ./marine-service
      dockerfile: Dockerfile
    container_name: mermaid-marine
    restart: unless-stopped
    depends_on:
      mermaid-db:
        condition: service_healthy
    environment:
      DB_NAME: ${POSTGRES_DB:-mermaid_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      DB_HOST: mermaid-db
      DB_PORT: 5432
      MARINE_API_KEY: ${MARINE_API_KEY:-dev-marine-key-change-in-prod}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-secret-change-in-prod}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_ORIGINS: "http://localhost http://localhost:80 http://mermaid-backend:8080"
    ports:
      - "8081:8081"
    networks:
      - mermaid-net

  # ── React Frontend (Vite Dev Server) ────────────────────
  mermaid-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mermaid-frontend
    restart: unless-stopped
    depends_on:
      - mermaid-backend
    environment:
      VITE_API_TARGET: http://mermaid-backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - mermaid-net

# ── Volumes ───────────────────────────────────────────────
volumes:
  pgdata:

# ── Network ──────────────────────────────────────────────
networks:
  mermaid-net:
    driver: bridge
