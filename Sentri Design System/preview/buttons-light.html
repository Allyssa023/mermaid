<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 30px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.14;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  .btn--primary { background: var(--primary); color: #fff; }
  .btn--primary-pressed { background: var(--surface-press-stronger); color: var(--ink-press); }
  .btn--disabled { background: var(--hairline-cloud); color: var(--on-dark-muted); }
  .label {
    font-family: var(--font-code);
    font-size: 10px;
    letter-spacing: 0.4px;
    color: var(--accent-violet-mid);
    text-transform: uppercase;
    margin-top: 8px;
  }
  .cell { display: flex; flex-direction: column; }
</style></head>
<body>
<div class="card">
  <div class="row">
    <div class="cell"><button class="btn btn--primary">Get started</button><div class="label">button-primary</div></div>
    <div class="cell"><button class="btn btn--primary-pressed">Get started</button><div class="label">…pressed</div></div>
    <div class="cell"><button class="btn btn--disabled">Get started</button><div class="label">…disabled</div></div>
  </div>
</div>
</body></html>
