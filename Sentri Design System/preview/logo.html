<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .half { padding: 32px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
  .half--light { background: #fff; color: var(--ink-deep); }
  .half--dark { background: var(--surface-canvas-dark); color: #fff; }
  .half svg { width: 180px; height: auto; }
  .label {
    position: absolute;
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 6px;
  }
</style></head>
<body>
<div class="card">
  <div class="half half--light">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64"><text x="0" y="48" font-family="Space Grotesk, Rubik, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.4" fill="currentColor">sentri</text><rect x="124" y="14" width="9" height="9" rx="1.5" fill="#c2ef4e"/></svg>
  </div>
  <div class="half half--dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64"><text x="0" y="48" font-family="Space Grotesk, Rubik, sans-serif" font-weight="700" font-size="44" letter-spacing="-1.4" fill="currentColor">sentri</text><rect x="124" y="14" width="9" height="9" rx="1.5" fill="#c2ef4e"/></svg>
  </div>
</div>
</body></html>
