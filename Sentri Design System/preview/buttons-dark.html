<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card--dark { padding: 30px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.14;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  .btn--inverted { background: #fff; color: var(--ink-deep); box-shadow: 0 2px 8px 0 rgba(0,0,0,0.18); }
  .btn--inverted-pressed { background: var(--surface-press-light); color: var(--ink-press); box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,.18); }
  .btn--ghost {
    background: var(--on-dark-faint);
    color: #fff;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 500;
    font-size: 14px;
  }
  .btn--violet-token {
    background: var(--accent-violet-mid);
    color: #fff;
    border-radius: 12px;
    padding: 8px 16px;
    font-weight: 500;
    border: 1px solid #5d4a78;
  }
  .label {
    font-family: var(--font-code);
    font-size: 10px;
    letter-spacing: 0.4px;
    color: var(--on-dark-muted);
    text-transform: uppercase;
    margin-top: 8px;
  }
  .cell { display: flex; flex-direction: column; }
</style></head>
<body>
<div class="card card--dark">
  <div class="row">
    <div class="cell"><button class="btn btn--inverted">Get started</button><div class="label">button-inverted</div></div>
    <div class="cell"><button class="btn btn--inverted-pressed">Get started</button><div class="label">…pressed</div></div>
    <div class="cell"><button class="btn btn--ghost">Get demo</button><div class="label">button-ghost-on-dark</div></div>
    <div class="cell"><button class="btn btn--violet-token">Performance</button><div class="label">button-violet-token</div></div>
  </div>
</div>
</body></html>
