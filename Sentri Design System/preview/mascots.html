<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card--dark { padding: 20px; }
  .row { display: flex; gap: 20px; align-items: flex-end; justify-content: space-around; }
  .row img { width: 140px; height: auto; }
  .row .tilt-l { transform: rotate(-4deg); }
  .row .tilt-r { transform: rotate(3deg); }
  .label {
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--on-dark-muted);
    margin-top: 14px;
    text-align: center;
  }
</style></head>
<body>
<div class="card card--dark">
  <div class="row">
    <img class="tilt-l" src="../assets/mascots/astronaut.svg" alt="astronaut mascot">
    <img src="../assets/mascots/cone.svg" alt="cone mascot">
    <img class="tilt-r" src="../assets/mascots/monster.svg" alt="monster mascot">
  </div>
  <div class="label">Sticker mascot layer · placeholder artwork · break grid, never sit inside cards</div>
</div>
</body></html>
