<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card--dark { padding: 32px; }
  .spec { display: flex; align-items: baseline; gap: 16px; }
  .spec__meta {
    flex: 0 0 84px;
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--on-dark-muted);
    line-height: 1.4;
  }
  .stack { display: flex; flex-direction: column; gap: 28px; }
</style>
</head>
<body>
<div class="card card--dark">
  <div class="stack">
    <div class="spec">
      <div class="spec__meta">DISPLAY<br>HERO<br>88 · 700</div>
      <div class="t-display-hero" style="line-height:1.0;">Fix it <span class="chip-lime">faster</span></div>
    </div>
    <div class="spec">
      <div class="spec__meta">DISPLAY<br>LARGE<br>60 · 500</div>
      <div class="t-display-large">Section opener</div>
    </div>
  </div>
</div>
</body></html>
