<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; overflow: hidden; }
  .strip {
    background: #fff;
    padding: 22px 0 14px;
  }
  .strip img { display: block; width: 100%; height: 28px; }
  .strip__cols {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    padding: 18px 32px 8px;
  }
  .strip__col {
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-deep);
  }
  .strip__col strong {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    margin-bottom: 6px;
    color: var(--accent-violet-mid);
    font-weight: 500;
  }
  .legal {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--accent-violet-mid);
    padding: 8px 32px 18px;
    display: flex;
    justify-content: space-between;
  }
</style></head>
<body>
<div class="card">
  <div class="strip">
    <img src="../assets/lime-squiggle.svg" alt="lime squiggle divider">
    <div class="strip__cols">
      <div class="strip__col"><strong>Product</strong>Error monitoring<br>Performance<br>Replays</div>
      <div class="strip__col"><strong>Company</strong>About<br>Careers<br>Newsroom</div>
      <div class="strip__col"><strong>Resources</strong>Docs<br>Changelog<br>Status</div>
    </div>
    <div class="legal"><span>© 2026 Sentri</span><span>Privacy · Terms</span></div>
  </div>
</div>
</body></html>
