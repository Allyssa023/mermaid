<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; overflow: hidden; }
  .hero {
    background: url("../assets/textures/starfield.svg") center / cover;
    padding: 36px 32px;
    color: #fff;
    min-height: 220px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .hero__copy {
    max-width: 480px;
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 700;
    line-height: 1.1;
  }
  .eyebrow {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    color: var(--on-dark-muted);
    margin-bottom: 10px;
  }
</style></head>
<body>
<div class="card">
  <div class="hero">
    <div>
      <div class="eyebrow">Starfield hero texture</div>
      <div class="hero__copy">Code breaks. Fix it <span class="chip-lime">faster</span>.</div>
    </div>
  </div>
</div>
</body></html>
