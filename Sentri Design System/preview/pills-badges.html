<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card--dark { padding: 28px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .pill-neutral {
    background: var(--surface-night);
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 12px;
    line-height: 1.43;
  }
  .pill-violet {
    background: var(--accent-violet-mid);
    color: #fff;
    padding: 6px 12px;
    border-radius: 12px;
    font-family: var(--font-ui);
    font-size: 13px;
    border: 1px solid #5d4a78;
  }
  .badge-micro {
    background: var(--accent-lime);
    color: var(--ink-deep);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    line-height: 1.8;
    text-transform: uppercase;
    letter-spacing: 0.25px;
  }
  .label {
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--on-dark-muted);
    margin-right: 12px;
    width: 140px;
  }
</style></head>
<body>
<div class="card card--dark">
  <div class="row"><div class="label">pill-neutral-dark</div><span class="pill-neutral">Production</span><span class="pill-neutral">v2.4.1</span><span class="pill-neutral">api</span></div>
  <div class="row"><div class="label">button-violet-token</div><span class="pill-violet">Performance</span><span class="pill-violet">Profiling</span><span class="pill-violet">Replays</span></div>
  <div class="row"><div class="label">micro-cap badge</div><span class="badge-micro">Beta</span><span class="badge-micro">Stable</span><span class="badge-micro">v2.1</span></div>
</div>
</body></html>
