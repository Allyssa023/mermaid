<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="swatch-row">
    <div class="swatch">
      <div class="swatch__chip" style="background:#150f23"></div>
      <div class="swatch__name">Midnight Violet</div>
      <div class="swatch__hex">#150F23</div>
      <div class="swatch__role">--primary · CTA fill on light</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#1f1633"></div>
      <div class="swatch__name">Ink Violet</div>
      <div class="swatch__hex">#1F1633</div>
      <div class="swatch__role">--ink-deep · hero bg + body ink</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#c2ef4e"></div>
      <div class="swatch__name">Electric Lime</div>
      <div class="swatch__hex">#C2EF4E</div>
      <div class="swatch__role">--accent-lime · keyword chips</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#fa7faa"></div>
      <div class="swatch__name">Hot Pink</div>
      <div class="swatch__hex">#FA7FAA</div>
      <div class="swatch__role">--accent-pink · punctuation</div>
    </div>
  </div>
</div>
</body></html>
