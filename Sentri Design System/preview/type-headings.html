<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px solid var(--hairline-cloud); }
  .row:last-child { border-bottom: none; }
  .meta {
    flex: 0 0 110px;
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent-violet-mid);
    line-height: 1.4;
  }
</style></head>
<body>
<div class="card">
  <div class="row"><div class="meta">HEADING XL<br>30 · 500</div><div class="t-heading-xl">Pricing plans for dev teams</div></div>
  <div class="row"><div class="meta">HEADING LG<br>27 · 500</div><div class="t-heading-lg">Sub-section heading</div></div>
  <div class="row"><div class="meta">HEADING MD<br>24 · 500</div><div class="t-heading-md">Card title or in-page section</div></div>
  <div class="row"><div class="meta">HEADING SM<br>20 · 600</div><div class="t-heading-sm">Compact card title</div></div>
</div>
</body></html>
