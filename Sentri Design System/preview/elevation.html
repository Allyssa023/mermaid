<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; background: #fafafa; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .demo {
    height: 88px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--hairline-cloud);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-code);
    font-size: 11px;
    color: var(--accent-violet-mid);
  }
  .lvl-1 { box-shadow: 0 2px 8px 0 rgba(0,0,0,0.08); }
  .lvl-2 { box-shadow: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10); }
  .lvl-3-host {
    background: #1f1633;
    padding: 18px 14px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .lvl-3-btn {
    background: #fff;
    color: var(--ink-deep);
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    box-shadow: 0 0 8px 6px rgb(21,15,35);
  }
  .lvl-4 { box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,.18); }
  .label {
    font-family: var(--font-code);
    font-size: 10px;
    letter-spacing: 0.4px;
    color: var(--accent-violet-mid);
    text-transform: uppercase;
    margin-top: 8px;
  }
</style></head>
<body>
<div class="card">
  <div class="row">
    <div>
      <div class="demo lvl-1">button lift</div>
      <div class="label">Level 1</div>
    </div>
    <div>
      <div class="demo lvl-2">float card</div>
      <div class="label">Level 2</div>
    </div>
    <div>
      <div class="demo lvl-3-host"><div class="lvl-3-btn">Get started</div></div>
      <div class="label">Level 3 · glow halo</div>
    </div>
    <div>
      <div class="demo lvl-4">pressed</div>
      <div class="label">Level 4</div>
    </div>
  </div>
</div>
</body></html>
