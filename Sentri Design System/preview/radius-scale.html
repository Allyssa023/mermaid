<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
  }
  .tile {
    aspect-ratio: 1;
    background: var(--ink-deep);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 8px;
    color: var(--on-primary);
  }
  .tile__name {
    font-family: var(--font-code);
    font-size: 10px;
    letter-spacing: 0.4px;
    color: var(--on-dark-muted);
  }
  .tile__val {
    font-family: var(--font-code);
    font-size: 11px;
    color: var(--on-primary);
  }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="tile" style="border-radius:4px"><div class="tile__name">xs</div><div class="tile__val">4</div></div>
    <div class="tile" style="border-radius:6px"><div class="tile__name">sm</div><div class="tile__val">6</div></div>
    <div class="tile" style="border-radius:8px"><div class="tile__name">md</div><div class="tile__val">8</div></div>
    <div class="tile" style="border-radius:10px"><div class="tile__name">lg</div><div class="tile__val">10</div></div>
    <div class="tile" style="border-radius:12px"><div class="tile__name">xl</div><div class="tile__val">12</div></div>
    <div class="tile" style="border-radius:18px"><div class="tile__name">xxl</div><div class="tile__val">18</div></div>
    <div class="tile" style="border-radius:9999px"><div class="tile__name">full</div><div class="tile__val">∞</div></div>
  </div>
</div>
</body></html>
