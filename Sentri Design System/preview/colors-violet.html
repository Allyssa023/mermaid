<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="swatch-row">
    <div class="swatch">
      <div class="swatch__chip" style="background:#6a5fc1"></div>
      <div class="swatch__name">Violet Link</div>
      <div class="swatch__hex">#6A5FC1</div>
      <div class="swatch__role">--accent-violet · inline link emphasis</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#422082"></div>
      <div class="swatch__name">Deep Violet</div>
      <div class="swatch__hex">#422082</div>
      <div class="swatch__role">--accent-violet-deep · select / spotlight</div>
    </div>
    <div class="swatch">
      <div class="swatch__chip" style="background:#79628c"></div>
      <div class="swatch__name">Mid Violet</div>
      <div class="swatch__hex">#79628C</div>
      <div class="swatch__role">--accent-violet-mid · tag chips, hairlines on dark</div>
    </div>
  </div>
</div>
</body></html>
