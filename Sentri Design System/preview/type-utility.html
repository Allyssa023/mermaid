<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; }
  .row { display: flex; gap: 18px; padding: 12px 0; border-bottom: 1px solid var(--hairline-cloud); align-items: center; }
  .row:last-child { border-bottom: none; }
  .meta {
    flex: 0 0 130px;
    font-family: var(--font-code);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent-violet-mid);
    line-height: 1.4;
  }
  .pill {
    display: inline-block;
    padding: 6px 12px;
    background: var(--primary);
    color: var(--on-primary);
    border-radius: 8px;
  }
  .pill--ghost {
    background: transparent;
    color: var(--ink-deep);
    border: 1px solid var(--hairline-cool);
  }
</style></head>
<body>
<div class="card">
  <div class="row">
    <div class="meta">EYEBROW<br>15 · 500 · 0.2px</div>
    <div class="t-eyebrow" style="color:var(--accent-violet-mid)">Error monitoring</div>
  </div>
  <div class="row">
    <div class="meta">BUTTON CAP<br>14 · 700 · 0.2px</div>
    <div class="pill t-button-cap">Get started</div>
  </div>
  <div class="row">
    <div class="meta">BUTTON CAP LIGHT<br>14 · 500 · 0.2px</div>
    <div class="pill pill--ghost t-button-cap-light">Get demo</div>
  </div>
  <div class="row">
    <div class="meta">CAPTION<br>14 · 400</div>
    <div class="t-caption" style="color:var(--accent-violet-mid)">Footer text, helper copy, fine print.</div>
  </div>
  <div class="row">
    <div class="meta">MICRO CAP<br>10 · 600 · 0.25px</div>
    <div class="t-micro-cap" style="color:var(--accent-violet-mid)">Beta · v2.1 · Stable</div>
  </div>
</div>
</body></html>
