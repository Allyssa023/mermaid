server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # ── Eureka discovery locator ─────────────────────────────────────────
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # ── Routes (lb:// = load-balanced via Eureka) ────────────────────────
          routes:
            # All /api/** requests → Spring Boot backend (via Eureka)
            - id: backend-api
              uri: lb://mermaid-backend
              predicates:
                - Path=/api/**

            # WebSocket upgrade for chat
            - id: backend-ws
              uri: lb://mermaid-backend
              predicates:
                - Path=/ws-chat/**

          # ── Global CORS (browser → gateway) ──────────────────────────────────
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

# ── JWT config (same secret as the backend) ──────────────────────────────────
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-use-env-var}

# ── Eureka client (disabled by default, enabled in Step 8) ───────────────────
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
